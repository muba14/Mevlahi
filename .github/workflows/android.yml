name: Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk Mevlahi.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Mevlahi-APK
          path: Mevlahi.apk
