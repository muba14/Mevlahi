<div id="app">
  <header class="top">
    <div class="brand">
      <div class="brand-logo"><svg><use href="#dervish"/></svg></div>
      <div>
        <h1>Mevlahi</h1>
        <p class="sub">İlahiler</p>
      </div>
    </div>
    <button class="textsize" id="btnText" aria-label="Yazı boyutu">
      <span class="aa">Aa</span><span class="lbl" id="textLbl">Normal</span>
    </button>
  </header>

  <div class="search">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="İlahi ara…" autocomplete="off" enterkeyhint="search">
    <button id="qClear" class="qclear" aria-label="Aramayı temizle" hidden><svg><use href="#i-x"/></svg></button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="all" role="tab">Tümü <span class="cnt" id="cntAll">0</span></button>
    <button class="tab" data-tab="fav" role="tab">Favorilerim <span class="cnt" id="cntFav">0</span></button>
  </div>

  <main id="list" class="list" aria-live="polite"></main>
</div>

<!-- Alt çalar -->
<div class="mini" id="mini" hidden>
  <div class="mini-progress"><div id="miniBar"></div></div>
  <button class="mini-info" id="miniOpen">
    <span class="mini-title" id="miniTitle"></span>
    <span class="mini-hint">Büyütmek için dokunun</span>
  </button>
  <button class="mini-btn play" id="miniPlay" aria-label="Oynat"><svg><use href="#i-play"/></svg></button>
  <button class="mini-btn" id="miniNext" aria-label="Sonraki"><svg><use href="#i-next"/></svg></button>
</div>

<!-- Büyük çalar -->
<section class="player" id="player" hidden>
  <button class="close" id="pClose"><svg><use href="#i-down"/></svg><span>Kapat</span></button>
  <div class="disc-wrap">
    <div class="disc" id="disc"><svg><use href="#dervish"/></svg></div>
  </div>
  <div class="p-meta">
    <h2 id="pTitle"></h2>
    <p id="pArtist"></p>
  </div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="İlahi konumu">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="ctl" id="pPrev"><svg><use href="#i-prev"/></svg><span>Önceki</span></button>
    <button class="ctl big" id="pPlay"><svg><use href="#i-play"/></svg><span id="pPlayLbl">Oynat</span></button>
    <button class="ctl" id="pNext"><svg><use href="#i-next"/></svg><span>Sonraki</span></button>
  </div>
  <div class="toggles">
    <button class="tog" id="pRepeat"><svg><use href="#i-repeat"/></svg><span id="pRepeatLbl">Sırayla çal</span></button>
    <button class="tog" id="pFav"><svg><use href="#i-heart"/></svg><span id="pFavLbl">Favoriye ekle</span></button>
  </div>
</section>

<div class="toast" id="toast" hidden></div>
<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
